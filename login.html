<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#29172a">
<title>Admin Login | Ojasva Events</title>
<link rel="icon" href="assets/ojasva-monogram.png" type="image/png" sizes="256x256">
<link rel="stylesheet" href="assets/site.css">
<style>
.login-body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 30px 16px;
  background-color: var(--plum);
  color: #fff8f4;
  background-image: radial-gradient(circle at 50% 20%, #3e1f40 0%, var(--plum) 70%);
}
.login-card {
  width: min(440px, 100%);
  background: #fffaf6;
  color: var(--ink);
  border: 1px solid var(--border);
  padding: 36px 30px;
  box-shadow: 0 20px 45px rgba(18, 9, 20, 0.45);
}
.login-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 26px;
}
.login-brand img {
  width: 58px;
  height: 58px;
  margin-bottom: 12px;
}
.login-title {
  font-family: var(--serif);
  font-size: 1.85rem;
  line-height: 1.1;
  color: var(--plum);
  margin: 0;
}
.login-sub {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 6px 0 0;
}
.login-fields {
  display: grid;
  gap: 15px;
  margin-bottom: 20px;
}
.login-fields label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.login-fields input {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 10px 12px;
  border: 1px solid #c8b7c0;
  background: white;
  font-size: 0.95rem;
  color: var(--ink);
}
.login-fields input:focus {
  outline: 2px solid #8e4f62;
  border-color: #8e4f62;
}
.cred-badge {
  background: #f3e9e3;
  padding: 10px 14px;
  font-size: 0.78rem;
  color: #6a424e;
  border-left: 3px solid #8e4f62;
  margin-bottom: 18px;
  line-height: 1.5;
}
.cred-badge code {
  font-weight: 700;
  background: #fff;
  padding: 2px 5px;
  border: 1px solid #decac4;
}
.alert-error {
  padding: 10px 12px;
  background: #fde8e8;
  color: #9b1c1c;
  border: 1px solid #f8b4b4;
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
}
.back-link {
  display: block;
  text-align: center;
  margin-top: 22px;
  font-size: 0.84rem;
  color: #eed6c9;
}
.back-link:hover {
  text-decoration: underline;
  color: var(--gold);
}
</style>
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">
    <img src="assets/ojasva-monogram.png" alt="Ojasva Events">
    <h1 class="login-title">Admin Login</h1>
    <p class="login-sub">Ojasva Events — Lead Management Portal</p>
  </div>

  <div class="cred-badge">
    <strong>Admin Credentials:</strong><br>
    Login ID: <code>admin@123</code> &nbsp;|&nbsp; Password: <code>admin</code>
  </div>

  <div id="login-error" class="alert-error" role="alert"></div>

  <form id="login-form">
    <div class="login-fields">
      <label>
        Login ID
        <input type="text" id="username" required value="admin@123" placeholder="e.g. admin@123" autocomplete="username">
      </label>
      <label>
        Password
        <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
      </label>
    </div>

    <button type="submit" class="button primary" style="width:100%" id="login-btn">
      Sign In to Dashboard →
    </button>
  </form>
</div>

<a href="index.html" class="back-link">← Return to Ojasva Events Home</a>

<script>
// If already logged in, redirect straight to dashboard
if (sessionStorage.getItem('ojasva_admin_session')) {
  window.location.href = 'dashboard.html';
}

const form = document.getElementById('login-form');
const errorBox = document.getElementById('login-error');
const submitBtn = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'Verifying...';

  let authenticated = false;

  // 1. Try server API
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      const data = await res.json();
      if (data.success) authenticated = true;
    }
  } catch (err) {
    // Offline / static file preview fallback
  }

  // 2. Client-side fallback check
  if (username === 'admin@123' && password === 'admin') {
    authenticated = true;
  }

  if (authenticated) {
    sessionStorage.setItem('ojasva_admin_session', JSON.stringify({
      user: username,
      token: 'token_' + Date.now(),
      loggedInAt: new Date().toISOString()
    }));
    localStorage.setItem('ojasva_admin_authenticated', 'true');
    window.location.href = 'dashboard.html';
  } else {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In to Dashboard →';
    errorBox.textContent = 'Invalid Login ID or Password. Please try again.';
    errorBox.style.display = 'block';
  }
});
</script>

</body>
</html>
